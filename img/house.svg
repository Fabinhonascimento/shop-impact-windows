<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="Modern South Florida home at dusk with French doors, arched window and sliding glass door">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glassCool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26507c"/>
      <stop offset="1" stop-color="#1a3c60"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5b8a"/>
      <stop offset="1" stop-color="#21486f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <g id="frond">
      <path d="M0 0 Q45 -38 110 -18 Q55 -16 0 0Z"/>
    </g>
  </defs>

  <!-- ground -->
  <rect x="0" y="578" width="900" height="62" fill="#0a1f36"/>
  <ellipse cx="470" cy="590" rx="190" ry="40" fill="url(#glow)"/>

  <!-- upper volume -->
  <rect x="300" y="110" width="420" height="142" fill="url(#wall2)"/>
  <rect x="282" y="96" width="456" height="16" rx="2" fill="#0d2742"/>

  <!-- main volume -->
  <rect x="140" y="250" width="640" height="330" fill="url(#wall)"/>
  <rect x="120" y="236" width="680" height="16" rx="2" fill="#0d2742"/>

  <!-- upper windows (impact casements) -->
  <g stroke="#e2e8f0" stroke-width="5">
    <rect x="340" y="140" width="100" height="86" fill="url(#glass)"/>
    <line x1="390" y1="140" x2="390" y2="226"/>
    <rect x="460" y="140" width="100" height="86" fill="url(#glassCool)" fill-opacity=".85"/>
    <line x1="510" y1="140" x2="510" y2="226"/>
    <rect x="580" y="140" width="100" height="86" fill="url(#glass)"/>
    <line x1="630" y1="140" x2="630" y2="226"/>
  </g>

  <!-- arched window (left) -->
  <g stroke="#e2e8f0" stroke-width="6" fill="none">
    <path d="M185 392 A60 60 0 0 1 305 392 L305 522 L185 522 Z" fill="url(#glass)"/>
    <line x1="245" y1="332" x2="245" y2="522" stroke-width="4"/>
    <line x1="185" y1="392" x2="305" y2="392" stroke-width="4"/>
    <line x1="185" y1="457" x2="305" y2="457" stroke-width="4"/>
  </g>
  <rect x="176" y="522" width="138" height="10" fill="#e2e8f0"/>

  <!-- French doors (center) -->
  <rect x="372" y="312" width="196" height="268" fill="#0d2742"/>
  <g stroke="#e2e8f0" stroke-width="6">
    <!-- transom -->
    <path d="M380 362 L380 340 Q470 300 560 340 L560 362 Z" fill="url(#glass)"/>
    <!-- leaves -->
    <rect x="380" y="368" width="90" height="212" fill="#e2e8f0"/>
    <rect x="470" y="368" width="90" height="212" fill="#e2e8f0"/>
  </g>
  <g fill="url(#glass)">
    <rect x="391" y="379" width="68" height="190"/>
    <rect x="481" y="379" width="68" height="190"/>
  </g>
  <g stroke="#e2e8f0" stroke-width="4">
    <line x1="425" y1="379" x2="425" y2="569"/>
    <line x1="515" y1="379" x2="515" y2="569"/>
    <line x1="391" y1="426" x2="459" y2="426"/>
    <line x1="391" y1="474" x2="459" y2="474"/>
    <line x1="391" y1="521" x2="459" y2="521"/>
    <line x1="481" y1="426" x2="549" y2="426"/>
    <line x1="481" y1="474" x2="549" y2="474"/>
    <line x1="481" y1="521" x2="549" y2="521"/>
  </g>
  <rect x="461" y="466" width="4" height="20" rx="2" fill="#94a3b8"/>
  <rect x="475" y="466" width="4" height="20" rx="2" fill="#94a3b8"/>

  <!-- sliding glass door (right) -->
  <g stroke="#e2e8f0" stroke-width="6">
    <rect x="612" y="352" width="140" height="226" fill="url(#glassCool)" fill-opacity=".85"/>
    <line x1="682" y1="352" x2="682" y2="578"/>
  </g>
  <rect x="672" y="455" width="4" height="26" rx="2" fill="#e2e8f0"/>
  <rect x="688" y="455" width="4" height="26" rx="2" fill="#e2e8f0"/>

  <!-- glass reflections -->
  <g stroke="#ffffff" stroke-opacity=".35" stroke-width="5" stroke-linecap="round">
    <line x1="200" y1="510" x2="230" y2="470"/>
    <line x1="398" y1="560" x2="418" y2="535"/>
    <line x1="488" y1="560" x2="508" y2="535"/>
    <line x1="625" y1="560" x2="665" y2="505"/>
    <line x1="352" y1="216" x2="372" y2="190"/>
    <line x1="592" y1="216" x2="612" y2="190"/>
  </g>

  <!-- steps / walkway -->
  <rect x="360" y="578" width="220" height="10" fill="#cbd5e1" fill-opacity=".25"/>

  <!-- palm trees -->
  <g fill="#081a2e">
    <path d="M60 640 C66 520 82 420 112 330 L124 334 C96 422 82 522 80 640 Z"/>
    <g transform="translate(118 330)">
      <use href="#frond" transform="rotate(-10)"/>
      <use href="#frond" transform="rotate(25)"/>
      <use href="#frond" transform="rotate(60)"/>
      <use href="#frond" transform="scale(-1 1) rotate(-10)"/>
      <use href="#frond" transform="scale(-1 1) rotate(25)"/>
      <use href="#frond" transform="scale(-1 1) rotate(60)"/>
      <use href="#frond" transform="rotate(-45) scale(.85)"/>
      <use href="#frond" transform="scale(-1 1) rotate(-45) scale(.85)"/>
    </g>
    <path d="M846 640 C842 540 828 460 806 390 L816 386 C840 456 856 538 862 640 Z"/>
    <g transform="translate(810 388) scale(.8)">
      <use href="#frond" transform="rotate(-10)"/>
      <use href="#frond" transform="rotate(25)"/>
      <use href="#frond" transform="rotate(60)"/>
      <use href="#frond" transform="scale(-1 1) rotate(-10)"/>
      <use href="#frond" transform="scale(-1 1) rotate(25)"/>
      <use href="#frond" transform="scale(-1 1) rotate(60)"/>
      <use href="#frond" transform="rotate(-45) scale(.85)"/>
      <use href="#frond" transform="scale(-1 1) rotate(-45) scale(.85)"/>
    </g>
  </g>

  <!-- shrubs -->
  <g fill="#0c2a44">
    <ellipse cx="190" cy="578" rx="60" ry="22"/>
    <ellipse cx="330" cy="580" rx="34" ry="16"/>
    <ellipse cx="770" cy="580" rx="50" ry="18"/>
  </g>
</svg>
